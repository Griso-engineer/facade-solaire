<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests · Façade solaire</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css?v=1">
  <style>
    body { padding: 24px var(--pad); display: block; }
    .ok { color: var(--c-ok); font-weight: 700; } .ko { color: var(--c-red); font-weight: 700; }
    h1 { font-weight: 900; font-size: 40px; letter-spacing: -0.04em; margin-bottom: 8px; }
    h2 { font-size: 18px; font-weight: 800; margin: 28px 0 8px; }
    td.d { color: var(--muted); font-size: 12.5px; }
  </style>
</head>
<body>
  <h1 id="title">Tests en cours…</h1>
  <p class="muted">Validation des calculs : on appelle les fonctions de l'application telles quelles et on compare
    leurs résultats à des références indépendantes. Ouvrir ce fichier par double-clic suffit.</p>
  <div id="out"></div>

  <script src="js/util.js"></script>
  <script src="js/solar.js"></script>
  <script src="js/osm.js"></script>
  <script src="js/building.js"></script>
  <script src="js/climate.js"></script>
  <script src="js/climate-paris.js"></script>
  <script src="js/irradiance.js"></script>
  <script src="js/masks.js"></script>
  <script src="js/thermal.js"></script>
  <script>
  (function () {
    'use strict';
    const out = document.getElementById('out');
    let table = null, nOk = 0, nKo = 0;
    function section(title) {
      out.append(FS.el('h2', {}, title));
      table = FS.el('table', { class: 'tbl' }); out.append(table);
    }
    function check(name, ok, detail) {
      ok ? nOk++ : nKo++;
      table.append(FS.el('tr', {}, FS.el('td', { class: ok ? 'ok' : 'ko' }, ok ? 'OK' : 'ÉCHEC'), FS.el('td', {}, name), FS.el('td', { class: 'd' }, detail)));
    }
    const near = (name, v, ref, tol, unit = '') =>
      check(name, Math.abs(v - ref) <= tol, v.toFixed(4) + unit + ' (référence ' + ref + unit + ' ± ' + tol + ')');
    const S = FS.solar;

    // ------------------------------------------------------------------
    section('1. Position du soleil');
    {
      // Exemple de référence de l'algorithme SPA du NREL (Reda & Andreas, 2008, tableau A5.1) :
      // 17 octobre 2003, 12 h 30 min 30 s heure locale (UTC−7), 39,742476° N, 105,1786° O.
      // Zénith topocentrique 50,11162°, azimut 194,34024°.
      const t = Date.UTC(2003, 9, 17, 19, 30, 30);
      const p = S.position(t, 39.742476, -105.1786);
      near('NREL SPA : zénith (avec réfraction)', p.zenith, 50.11162, 0.05, '°');
      near('NREL SPA : azimut', p.azimuth, 194.34024, 0.05, '°');
    }
    {
      // Hauteur maximale à Paris : 90° − φ + δ (δ = ±23,44° aux solstices)
      const lat = 48.8566, lon = 2.3522;
      const e = S.sunTimes(2026, S.doyOf(2026, 6, 21), lat, lon, 'Europe/Paris');
      near('Paris, 21 juin : hauteur à midi solaire', e.maxAlt, 64.60, 0.3, '°');
      const w = S.sunTimes(2026, S.doyOf(2026, 12, 21), lat, lon, 'Europe/Paris');
      near('Paris, 21 décembre : hauteur à midi solaire', w.maxAlt, 17.72, 0.4, '°');
      // Éphémérides (IMCCE) pour Paris : lever 5 h 47, coucher 21 h 58 le 21 juin 2026 ;
      // 8 h 41 et 16 h 56 le 21 décembre 2026.
      near('Paris, 21 juin : lever (min)', e.rise * 60, 5 * 60 + 47, 2, ' min');
      near('Paris, 21 juin : coucher (min)', e.set * 60, 21 * 60 + 58, 2, ' min');
      near('Paris, 21 décembre : lever (min)', w.rise * 60, 8 * 60 + 41, 2, ' min');
      near('Paris, 21 décembre : coucher (min)', w.set * 60, 16 * 60 + 56, 2, ' min');
      // Midi vrai ≈ 12 h − λ/15 − E(t) + décalage légal ; au 21 juin E ≈ −1,8 min → 13 h 52
      near('Paris, 21 juin : midi solaire (heure légale, min)', e.noon * 60, 13 * 60 + 52, 3, ' min');
    }
    {
      // Heure légale française
      const off = (y, m, d, h) => S.tzOffsetHours(Date.UTC(y, m - 1, d, h), 'Europe/Paris');
      check('Décalage UTC+1 en hiver', off(2026, 1, 15, 12) === 1, String(off(2026, 1, 15, 12)));
      check('Décalage UTC+2 en été', off(2026, 7, 15, 12) === 2, String(off(2026, 7, 15, 12)));
      check('Passage à l\'heure d\'été le 29 mars 2026 à 1 h UTC', off(2026, 3, 29, 0) === 1 && off(2026, 3, 29, 2) === 2, off(2026, 3, 29, 0) + ' → ' + off(2026, 3, 29, 2));
      const u = S.localToUTC(2026, S.doyOf(2026, 7, 1), 14, 'Europe/Paris');
      check('14 h légales le 1er juillet = 12 h UTC', new Date(u).getUTCHours() === 12, new Date(u).toISOString());
    }

    // ------------------------------------------------------------------
    section('2. Découpage en façades');
    const rect = (x0, y0, w, h) => [[x0, y0], [x0 + w, y0], [x0 + w, y0 + h], [x0, y0 + h]];
    {
      // Rectangle 20 m (est-ouest) × 10 m (nord-sud), H = 15 m, isolé
      const m = FS.building.facades({ xy: rect(-10, -5, 20, 10), height: 15 }, []);
      const f = m.facades;
      check('Rectangle isolé : 4 façades', f.length === 4, f.length + ' façades');
      check('Numérotation horaire depuis le nord : N, E, S, O', f.map((x) => x.label).join(',') === 'N,E,S,O', f.map((x) => x.label + ' ' + Math.round(x.az) + '°').join(' · '));
      near('Surface façade nord (20 × 15)', f[0].area, 300, 1e-6, ' m²');
      near('Surface façade est (10 × 15)', f[1].area, 150, 1e-6, ' m²');
      near('Périmètre', m.perimeter, 60, 1e-6, ' m');
      near('Emprise', m.footprintArea, 200, 1e-6, ' m²');
    }
    {
      // Polygone donné dans le sens horaire : le sens est corrigé par FS.geo.clean
      const cw = FS.geo.clean(rect(-10, -5, 20, 10).reverse());
      const f = FS.building.facades({ xy: cw, height: 10 }, []).facades;
      check('Anneau horaire remis dans le bon sens', f.map((x) => x.label).join(',') === 'N,E,S,O', f.map((x) => x.label).join(','));
    }
    {
      // Rectangle tourné de 30° : normales à 30°, 120°, 210°, 300°
      const a = 30 * Math.PI / 180, rot = (p) => [p[0] * Math.cos(a) + p[1] * Math.sin(a), -p[0] * Math.sin(a) + p[1] * Math.cos(a)];
      const xy = FS.geo.clean(rect(-10, -5, 20, 10).map(rot));
      const f = FS.building.facades({ xy, height: 10 }, []).facades;
      check('Rectangle tourné de 30° : azimuts 30/120/210/300', f.map((x) => Math.round(x.az)).join(',') === '30,120,210,300', f.map((x) => x.az.toFixed(2)).join(', '));
    }
    {
      // Mitoyen bas à l'est (9 m) : seule l'héberge (15 − 9 = 6 m) reste exposée
      const nb = { xy: rect(10, -5, 12, 10), height: 9 };
      const f = FS.building.facades({ xy: rect(-10, -5, 20, 10), height: 15 }, [nb]).facades;
      const e = f.find((x) => x.label === 'E');
      check('Mitoyen bas : façade est réduite à l\'héberge', e && e.pignon && Math.abs(e.area - 60) < 1e-6, e ? 'zMin ' + e.zMin + ' m, ' + e.area + ' m²' : 'absente');
      // Mitoyen plus haut : la façade est disparaît
      const f2 = FS.building.facades({ xy: rect(-10, -5, 20, 10), height: 15 }, [{ xy: rect(10, -5, 12, 10), height: 20 }]).facades;
      check('Mitoyen plus haut : façade est supprimée', f2.length === 3 && !f2.some((x) => x.label === 'E'), f2.map((x) => x.label).join(','));
      // Mitoyen partiel (5 m sur 10) : la façade est se divise en partie libre et héberge
      const f3 = FS.building.facades({ xy: rect(-10, -5, 20, 10), height: 15 }, [{ xy: rect(10, -5, 12, 5), height: 9 }]).facades;
      const es = f3.filter((x) => x.label === 'E');
      const sum = es.reduce((s, x) => s + x.area, 0);
      // la limite du mitoyen est localisée par dichotomie à ~1 cm près : 0,01 × 9 m ≈ 0,1 m²
      near('Mitoyen partiel : surface exposée à l\'est (5 × 15 + 5 × 6)', sum, 105, 0.1, ' m²');
      // Voisin à 3 m (rue étroite) : pas mitoyen
      const f4 = FS.building.facades({ xy: rect(-10, -5, 20, 10), height: 15 }, [{ xy: rect(13, -5, 12, 10), height: 30 }]).facades;
      check('Voisin à 3 m : la façade reste entière', f4.length === 4 && !f4.some((x) => x.pignon), f4.map((x) => x.label + (x.pignon ? '*' : '')).join(','));
    }
    {
      // Décroché de 1,5 m au milieu de la façade sud : les retours sont rattachés
      const xy = [[-10, -5], [-1, -5], [-1, -6.5], [1, -6.5], [1, -5], [10, -5], [10, 5], [-10, 5]];
      const m = FS.building.facades({ xy: FS.geo.clean(xy), height: 10 }, []);
      check('Décroché de 1,5 m : 4 façades', m.facades.length === 4, m.facades.map((x) => x.label + ' ' + x.length.toFixed(1)).join(' · '));
      const s = m.facades.find((x) => x.label === 'S');
      near('Façade sud : orientation non faussée par les retours', s.az, 180, 1e-6, '°');
      near('Façade sud : longueur développée (20 + 2 × 1,5)', s.length, 23, 1e-6, ' m');
    }
    {
      // Projection locale
      const pr = FS.geo.projector(48.85, 2.35);
      const xy = pr.toXY(48.851, 2.351);
      near('Projection : 0,001° de latitude ≈ 111,2 m', xy[1], 111.19, 0.05, ' m');
      near('Projection : 0,001° de longitude à 48,85° N ≈ 73,2 m', xy[0], 73.17, 0.05, ' m');
      const back = pr.toLL(xy[0], xy[1]);
      near('Projection aller-retour (latitude)', back[0], 48.851, 1e-9, '°');
    }
    {
      // Lecture des hauteurs OSM
      const d = { floorH: 3, defaultH: 15 };
      const h1 = FS.osm.heightFromTags({ height: '21,5 m' }, d);
      const h2 = FS.osm.heightFromTags({ 'building:levels': '6', 'roof:levels': '1' }, d);
      const h3 = FS.osm.heightFromTags({}, d);
      check('Tag height « 21,5 m »', h1.height === 21.5 && h1.src === 'height', h1.height + ' m, ' + h1.src);
      check('6 niveaux + 1 comble × 3 m = 19,5 m', h2.height === 19.5 && h2.src === 'levels', h2.height + ' m, ' + h2.src);
      check('Sans tag : hypothèse 15 m', h3.height === 15 && h3.src === 'default', h3.height + ' m, ' + h3.src);
    }

    // ------------------------------------------------------------------
    section('3. Rayonnement sur plan vertical');
    {
      const I = FS.irradiance;
      // Cas analytique, ciel isotrope : soleil plein sud à 30°, DNI 800, DHI 100, GHI = 800·sin 30° + 100 = 500
      const s = I.single(30, 180, 800, 100, 500, 180, { model: 'isotrope', albedo: 0.2 })[0];
      near('Mur sud, isotrope : 800·cos 30° + 100/2 + 0,2·500/2', s, 800 * Math.cos(Math.PI / 6) + 50 + 50, 0.01, ' W/m²');
      const nn = I.single(30, 180, 800, 100, 500, 0, { model: 'isotrope', albedo: 0.2 })[0];
      near('Mur nord au même instant : diffus + réfléchi seulement', nn, 100, 0.01, ' W/m²');
      const e = I.single(30, 180, 800, 100, 500, 90, { model: 'isotrope', albedo: 0.2 })[0];
      near('Mur est, soleil plein sud : incidence rasante', e, 100, 0.01, ' W/m²');
      const sw = I.single(30, 225, 800, 100, 500, 180, { model: 'isotrope', albedo: 0.2 })[0];
      near('Mur sud, soleil au sud-ouest : 800·cos 30°·cos 45° + 100', sw, 800 * Math.cos(Math.PI / 6) * Math.SQRT1_2 + 100, 0.01, ' W/m²');
      // Perez : ciel couvert (pas de direct, ε = 1) → résultat proche de l'isotrope (à ± 20 %)
      const po = I.single(30, 180, 0, 200, 200, 180, { model: 'perez', albedo: 0.2 })[0];
      const pi = I.single(30, 180, 0, 200, 200, 180, { model: 'isotrope', albedo: 0.2 })[0];
      check('Perez, ciel couvert : proche de l\'isotrope', Math.abs(po / pi - 1) < 0.2, po.toFixed(1) + ' contre ' + pi.toFixed(1) + ' W/m²');
      // Perez, ciel clair : le mur face au soleil reçoit plus de diffus qu'en isotrope, le mur opposé moins
      const pS = I.single(30, 180, 800, 100, 500, 180, { model: 'perez', albedo: 0.2 })[0];
      const pN = I.single(30, 180, 800, 100, 500, 0, { model: 'perez', albedo: 0.2 });
      check('Perez, ciel clair : diffus renforcé face au soleil', pS > s, pS.toFixed(1) + ' > ' + s.toFixed(1) + ' W/m²');
      check('Perez, ciel clair : mur nord sans circumsolaire, part isotrope réduite', pN.comp.circ[0] === 0 && pN.comp.iso[0] < 50,
        'isotrope ' + pN.comp.iso[0].toFixed(1) + ' W/m² (50 en ciel isotrope), horizon ' + pN.comp.hor[0].toFixed(1) + ' W/m²');
      // Décomposition d'Erbs : valeurs de l'article (Erbs, Klein, Duffie 1982)
      near('Erbs : kd(0,1)', I.erbsKd(0.1), 0.991, 0.001);
      near('Erbs : kd(0,5)', I.erbsKd(0.5), 0.6596, 0.001);
      near('Erbs : kd(0,9)', I.erbsKd(0.9), 0.165, 1e-6);
    }

    // ------------------------------------------------------------------
    section('4. Irradiation annuelle à Paris contre PVGIS (façades verticales non masquées)');
    {
      // Références PVGIS 5.3, base PVGIS-SARAH3 (satellite, 2005–2023), Paris 48,857° N 2,352° E,
      // inclinaison 90°, sans horizon. Interrogées le 8 novembre 2026 (API PVcalc, H(i)_y et H(i)_m).
      const PV = {
        S: { az: 180, y: 1016.2, m: [54.08, 72.43, 98.34, 105.02, 91.28, 86.45, 92.83, 99.69, 106.07, 89.6, 63.34, 57.07] },
        E: { az: 90, y: 742.78 }, O: { az: 270, y: 722.49 }, N: { az: 0, y: 309.66 }
      };
      const c = Object.assign(FS.climate.unpack(FS.CLIMATE_PARIS), { cacheKey: 'paris' });
      const t0 = performance.now();
      const Sk = FS.irradiance.sky(c, 48.857, 2.352, 'erbs');
      const res = {};
      for (const k in PV) {
        const a = PV[k].az * Math.PI / 180;
        const I = FS.irradiance.plane(Sk, Math.sin(a), Math.cos(a), { model: 'perez', albedo: 0.2 });
        const m = new Array(12).fill(0);
        for (let h = 0; h < Sk.n; h++) m[Sk.month[h]] += I[h] / 1000;
        res[k] = { y: m.reduce((s, v) => s + v, 0), m };
      }
      const ms = performance.now() - t0;
      const rel = (k) => (res[k].y - PV[k].y) / PV[k].y;
      check('Façade sud : écart à PVGIS < 10 % (critère de validation)', Math.abs(rel('S')) < 0.10,
        FS.fmt(res.S.y, 0) + ' kWh/m²·an contre ' + FS.fmt(PV.S.y, 0) + ' (' + (rel('S') * 100).toFixed(1) + ' %)');
      check('Façade est : écart à PVGIS < 10 %', Math.abs(rel('E')) < 0.10, FS.fmt(res.E.y, 0) + ' contre ' + FS.fmt(PV.E.y, 0) + ' (' + (rel('E') * 100).toFixed(1) + ' %)');
      check('Façade ouest : écart à PVGIS < 10 %', Math.abs(rel('O')) < 0.10, FS.fmt(res.O.y, 0) + ' contre ' + FS.fmt(PV.O.y, 0) + ' (' + (rel('O') * 100).toFixed(1) + ' %)');
      check('Façade nord : écart à PVGIS < 30 % (indicatif : diffus seul, modèles de ciel différents)', Math.abs(rel('N')) < 0.30,
        FS.fmt(res.N.y, 0) + ' contre ' + FS.fmt(PV.N.y, 0) + ' (' + (rel('N') * 100).toFixed(1) + ' %)');
      const mdev = res.S.m.map((v, i) => ((v - PV.S.m[i]) / PV.S.m[i] * 100).toFixed(0) + ' %');
      check('Façade sud, profil mensuel : écart d\'été (mai–août) < 15 %', [4, 5, 6, 7].every((i) => Math.abs(res.S.m[i] - PV.S.m[i]) / PV.S.m[i] < 0.15),
        'écarts mensuels janv.→déc. : ' + mdev.join(', '));
      check('Calcul annuel horaire (4 façades) en moins d\'une seconde', ms < 1000, FS.fmt(ms, 0) + ' ms');
      // Année type : proche de la moyenne pluriannuelle
      const sum = (a) => a.reduce((s, v) => s + v, 0);
      const r = sum(c.monthly.ghiTMY) / sum(c.monthly.ghiLT) - 1;
      check('Année type : rayonnement global annuel à ± 3 % de la moyenne 2015–2024', Math.abs(r) < 0.03,
        FS.fmt(sum(c.monthly.ghiTMY), 0) + ' contre ' + FS.fmt(sum(c.monthly.ghiLT), 0) + ' kWh/m² (' + (r * 100).toFixed(1) + ' %)');
    }

    // ------------------------------------------------------------------
    section('5. Masques');
    {
      const M = FS.masks, RAD = Math.PI / 180;
      const box = (x0, y0, w, h, H) => { const xy = rect(x0, y0, w, h); return { xy, height: H, bbox: FS.building.bbox(xy) }; };
      const edges = (target, H, nbs) => {
        const E = [];
        target.forEach((a, i) => { const b = target[(i + 1) % target.length]; E.push({ ax: a[0], ay: a[1], bx: b[0], by: b[1], h: H, self: true, edge: i }); });
        for (const nb of nbs) nb.xy.forEach((a, i) => { const b = nb.xy[(i + 1) % nb.xy.length]; E.push({ ax: a[0], ay: a[1], bx: b[0], by: b[1], h: nb.height, self: false, edge: i }); });
        return E;
      };
      // Mur sud d'un bâtiment 20 × 10 m (façade y = −5), point à 1,5 m de haut au milieu.
      const T = rect(-10, -5, 20, 10);
      const p = [0, -5.1, 1.5], n = [0, -1];
      // Bâtiment isolé : aucun auto-masque sur un volume convexe
      {
        const hz = M.horizon(p, n, edges(T, 15, []), 0);
        let mx = 0; for (let k = 0; k < 360; k++) if (hz[k] > mx) mx = hz[k];
        check('Volume convexe isolé : horizon dégagé', mx === 0, 'élévation maximale ' + (mx / RAD).toFixed(2) + '°');
        const sf = M.skyFactors(hz, n);
        near('Mur dégagé : ciel vu = 1', sf.svf, 1, 0.002);
        near('Mur dégagé : facteur de vue du ciel = 0,5', sf.F, 0.5, 0.001);
      }
      // Immeuble en vis-à-vis, très long (2 km), 21,5 m de haut, à 10 m (rue) : élévation à 45°... de face
      {
        const nb = box(-1000, -35.1 + 10, 2000, 20, 21.5); // façade nord du vis-à-vis en y = −15,1
        nb.xy = rect(-1000, -35.1, 2000, 20); nb.bbox = FS.building.bbox(nb.xy);
        const hz = M.horizon(p, n, edges(T, 15, [nb]), 0);
        // distance 10 m, hauteur au-dessus du point 20 m → atan(2) = 63,43°
        near('Vis-à-vis infini : élévation dans l\'axe = atan(20/10)', M.at(hz, 180) / RAD, Math.atan(2) / RAD, 0.05, '°');
        // à 60° de l'axe, la distance double : atan(20 cos 60° / 10) = 45°
        near('Vis-à-vis infini : élévation à 60° de l\'axe = atan(20·cos 60°/10)', M.at(hz, 240.5) / RAD, Math.atan(2 * Math.cos(60.5 * RAD)) / RAD, 0.3, '°');
        // Facteur de vue du ciel d'un élément vertical face à une obstruction infinie d'angle β : (1 − sin β)/2
        const beta = Math.atan(2);
        const sf = M.skyFactors(hz, n);
        near('Vis-à-vis infini : ciel vu = 1 − sin β (solution analytique 2D)', sf.svf, 1 - Math.sin(beta), 0.01);
        // seules les directions presque rasantes (≈ ±87° de l'axe) voient le vis-à-vis sous 6°
        check('Vis-à-vis haut : bande d\'horizon presque entièrement masquée', sf.hb < 0.05, 'part dégagée ' + sf.hb.toFixed(3));
        // Soleil de midi : masqué au 21 décembre (h ≈ 18°), visible au 21 juin (h ≈ 64,6° > 63,4°)
        const w = FS.solar.position(FS.solar.localToUTC(2026, FS.solar.doyOf(2026, 12, 21), 12.85, 'Europe/Paris'), 48.857, 2.352);
        const s = FS.solar.position(FS.solar.localToUTC(2026, FS.solar.doyOf(2026, 6, 21), 13.85, 'Europe/Paris'), 48.857, 2.352);
        check('Midi solaire du 21 décembre : soleil masqué par le vis-à-vis', w.altitude * RAD <= M.at(hz, w.azimuth), 'hauteur ' + w.altitude.toFixed(1) + '° ≤ masque ' + (M.at(hz, w.azimuth) / RAD).toFixed(1) + '°');
        check('Midi solaire du 21 juin : soleil visible au-dessus du vis-à-vis', s.altitude * RAD > M.at(hz, s.azimuth), 'hauteur ' + s.altitude.toFixed(1) + '° > masque ' + (M.at(hz, s.azimuth) / RAD).toFixed(1) + '°');
        // Un voisin plus bas que le point ne masque rien
        const low = box(-50, -40, 100, 10, 1.2);
        const hz2 = M.horizon(p, n, edges(T, 15, [low]), 0);
        check('Voisin plus bas que le point : aucun masque', M.at(hz2, 180) === 0, (M.at(hz2, 180) / RAD).toFixed(2) + '°');
        // Un obstacle derrière le mur ne masque rien
        const back = box(-50, 20, 100, 10, 60);
        const hz3 = M.horizon(p, n, edges(T, 15, [back]), 0);
        let mx = 0; for (let k = 0; k < 360; k++) if (hz3[k] > mx) mx = hz3[k];
        check('Obstacle derrière le mur : aucun masque', mx === 0, (mx / RAD).toFixed(2) + '°');
      }
      // Auto-masque : bâtiment en L, point au fond de l'angle rentrant
      {
        const L = FS.geo.clean([[0, 0], [30, 0], [30, 10], [10, 10], [10, 30], [0, 30]]);
        // façade de l'aile horizontale côté nord (y = 10, de x = 10 à 30), normale vers le nord
        const i = L.findIndex((a, k) => { const b = L[(k + 1) % L.length]; return Math.abs(a[1] - 10) < 1e-9 && Math.abs(b[1] - 10) < 1e-9; });
        const hz = M.horizon([12, 10.1, 1.5], [0, 1], edges(L, 15, []), i);
        // l'aile verticale (x = 10) est à 2 m à l'ouest : forte obstruction vers l'ouest-nord-ouest
        check('Bâtiment en L : l\'aile voisine masque l\'angle rentrant', M.at(hz, 280) / RAD > 45, 'élévation à 280° : ' + (M.at(hz, 280) / RAD).toFixed(1) + '°');
        check('Bâtiment en L : pas de masque vers l\'est', M.at(hz, 80) === 0, (M.at(hz, 80) / RAD).toFixed(2) + '°');
      }
      // Performance : quartier fictif de 300 voisins, bâtiment de 60 × 20 × 30 m
      {
        let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        const tgt = rect(-30, -10, 60, 20);
        const nbs = [];
        while (nbs.length < 300) {
          const x = (rnd() - 0.5) * 300, y = (rnd() - 0.5) * 300;
          if (Math.abs(x) < 50 && Math.abs(y) < 30) continue;
          nbs.push(Object.assign(box(x, y, 8 + rnd() * 20, 8 + rnd() * 20, 6 + rnd() * 30), { id: 'n' + nbs.length, src: 'height' }));
        }
        const model = FS.building.facades({ xy: tgt, height: 30 }, nbs);
        const D = { xy: tgt, H: 30, nbs, model };
        const r = M.compute(D);
        check('Quartier de 300 voisins : horizons de tous les points en moins de 2 s', r.ms < 2000, FS.fmt(r.nPts, 0) + ' points, ' + FS.fmt(r.ms, 0) + ' ms');
      }
    }

    // ------------------------------------------------------------------
    section('6. Bilan thermique : calcul à la main');
    {
      const B = FS.thermal.balanceMonth;
      /* Cas simple : façade sud 10 m × 3 m, fraction vitrée 50 % → A_w = 15 m², A_op = 15 m².
         U_w = 1,4 ; U_p = 0,3 → H_tr = 1,4·15 + 0,3·15 = 25,5 W/K.
         Zone de façade : profondeur 5 m, hauteur d'étage 3 m → A_f = 30/3·5 = 50 m², V = 150 m³.
         Renouvellement d'air 0,5 vol/h → H_ve = 0,34·0,5·150 = 25,5 W/K → H = 51 W/K.
         Inertie moyenne : C_m = 165 000·50 = 8,25·10⁶ J/K → τ = 8,25·10⁶/51/3600 = 44,93 h → a = 1 + τ/15 = 3,9956.
         Apports internes : 5 W/m²·50 m²·744 h = 186 kWh.

         Janvier : θe = 5 °C, θi = 20 °C, 744 h → Q_ht = 51·15·744/1000 = 569,16 kWh.
         Irradiation 50 kWh/m² (sous le seuil de protection), g = 0,6, menuiserie 25 %, F_w = 0,9 :
         Q_sol,w = 15·0,75·0,9·0,6·50 = 303,75 kWh ; Q_sol,op = 0,6·0,04·0,3·15·50 = 5,40 kWh.
         Q_gn = 303,75 + 5,40 + 186 = 495,15 kWh ; γ = 495,15/569,16 = 0,86997.
         γ^a = 0,57317 ; γ^(a+1) = 0,49864 ; η = (1 − 0,57317)/(1 − 0,49864) = 0,85135.
         Q_H = 569,16 − 0,85135·495,15 = 147,6 kWh.

         Juillet : θe = 21 °C, θc = 26 °C → Q_ht,C = 51·5·744/1000 = 189,72 kWh.
         Irradiation 100 kWh/m² : Q_sol = 607,5 + 10,8 = 618,3 kWh ; Q_gn = 804,3 kWh ; γ = 4,2394.
         γ^−a = 0,0031154 ; γ^−(a+1) = 0,00073486 ; η_ls = 0,99762.
         Q_C = 804,3 − 0,99762·189,72 = 615,0 kWh. */
      const H = 51, Cm = 165000 * 50;
      const jan = B({ H, Cm, thetaE: 5, thetaH: 20, thetaC: 26, hours: 744, Qsol: 303.75 + 5.4, Qint: 186 });
      near('τ de la zone de façade', jan.tau, 44.93, 0.01, ' h');
      near('Janvier : déperditions Q_ht', jan.QhtH, 569.16, 0.01, ' kWh');
      near('Janvier : facteur d\'utilisation des apports η_gn', jan.etaH, 0.85135, 0.0002);
      near('Janvier : besoin de chauffage Q_H', jan.QH, 147.6, 0.2, ' kWh');
      const jul = B({ H, Cm, thetaE: 21, thetaH: 20, thetaC: 26, hours: 744, Qsol: 607.5 + 10.8, Qint: 186 });
      near('Juillet : facteur d\'utilisation des pertes η_ls', jul.etaC, 0.99762, 0.0002);
      near('Juillet : besoin de froid Q_C', jul.QC, 615.0, 0.3, ' kWh');
      check('Juillet : pas de chauffage (θe > θi)', jul.QH === 0, String(jul.QH));
      // Cas limites
      const noGain = B({ H, Cm, thetaE: 5, thetaH: 20, thetaC: 26, hours: 744, Qsol: 0, Qint: 0 });
      near('Sans apports : Q_H = Q_ht', noGain.QH, noGain.QhtH, 1e-9, ' kWh');
      const big = B({ H, Cm, thetaE: 15, thetaH: 20, thetaC: 26, hours: 744, Qsol: 5000, Qint: 0 });
      check('Apports très supérieurs aux pertes : Q_H → 0', big.QH < 1, big.QH.toFixed(3) + ' kWh');
      const hot = B({ H, Cm, thetaE: 28, thetaH: 20, thetaC: 26, hours: 744, Qsol: 100, Qint: 50 });
      near('Extérieur plus chaud que la consigne : Q_C = Q_gn + |Q_ht,C|', hot.QC, 150 + 51 * 2 * 744 / 1000, 1e-9, ' kWh');

      // Chaîne complète (FS.thermal.compute) sur la même façade, irradiation horaire uniforme
      const n = 8760, month = new Uint8Array(n);
      for (let h = 0; h < n; h++) month[h] = FS.climate.monthOfHour(h);
      const hourly = new Float32Array(n);
      for (let h = 0; h < n; h++) hourly[h] = month[h] === 0 ? 50000 / 744 : month[h] === 6 ? 100000 / 744 : 0;
      const R = { sky: { n, month }, facades: [{ id: 1, label: 'S', az: 180, area: 30, glazed: 15, hourly }] };
      const Dm = { model: { facades: [{ id: 1 }] } };
      const tE = [5, 7, 9, 12, 16, 19, 21, 21, 17, 13, 9, 6];
      const Tt = Object.assign(FS.thermal.defaults(), { variants: [{ name: 'test', Uw: 1.4, g: 0.6, TL: 0.78 }], ref: 0 });
      const res = FS.thermal.compute(Dm, R, { monthly: { tTMY: tE } }, Tt, 3)[0].facades[0];
      near('Chaîne complète : plancher de la zone', res.floor, 50, 1e-9, ' m²');
      near('Chaîne complète : chauffage de janvier', res.months[0].QH, 147.6, 0.2, ' kWh');
      near('Chaîne complète : froid de juillet', res.months[6].QC, 615.0, 0.3, ' kWh');
      // Protection solaire : au-dessus du seuil, g → Fc·g
      const hot400 = new Float32Array(n).fill(400);
      const R2 = { sky: { n, month }, facades: [{ id: 1, label: 'S', az: 180, area: 30, glazed: 15, hourly: hot400 }] };
      const T0 = Object.assign({}, Tt, { protection: { mode: 'none', fc: 0.25, gtot: 0.1, threshold: 300 } });
      const T1 = Object.assign({}, Tt, { protection: { mode: 'fc', fc: 0.25, gtot: 0.1, threshold: 300 } });
      const q0 = FS.thermal.compute(Dm, R2, { monthly: { tTMY: tE } }, T0, 3)[0].facades[0].Qsol;
      const q1 = FS.thermal.compute(Dm, R2, { monthly: { tTMY: tE } }, T1, 3)[0].facades[0].Qsol;
      near('Protection Fc = 0,25 active en permanence : apports vitrés × 0,25', q1 / q0, 0.25, 1e-9);
      const T2 = Object.assign({}, Tt, { protection: { mode: 'fc', fc: 0.25, gtot: 0.1, threshold: 500 } });
      const q2 = FS.thermal.compute(Dm, R2, { monthly: { tTMY: tE } }, T2, 3)[0].facades[0].Qsol;
      near('Protection sous le seuil (400 < 500 W/m²) : sans effet', q2 / q0, 1, 1e-9);
    }

    document.getElementById('title').textContent = nKo ? nKo + ' test(s) en échec sur ' + (nOk + nKo) : 'Tous les tests passent (' + nOk + ')';
    document.getElementById('title').className = nKo ? 'ko' : 'ok';
  })();
  </script>
